plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

String findFlutterSdkPath() {
    def properties = new Properties()
    def localPropertiesFile = file("local.properties")
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withInputStream { properties.load(it) }
    }

    def candidates = [
        properties.getProperty("flutter.sdk"),
        System.getenv("FLUTTER_ROOT"),
        new File(rootDir.parentFile, ".fvm/flutter_sdk").path,
        new File(System.getProperty("user.home"), "fvm/default").path,
    ].findAll { it != null && !it.trim().isEmpty() }

    def flutterSdkPath = candidates.find { new File(it).exists() }
    assert flutterSdkPath != null : "Unable to locate Flutter SDK. Set flutter.sdk in local.properties, FLUTTER_ROOT, or install via FVM."
    return flutterSdkPath
}

String readFlutterEngineVersion() {
    return new File(findFlutterSdkPath(), "bin/cache/engine.stamp").text.trim()
}

android {
    namespace = 'com.builttoroam.devicecalendar'
    compileSdk = 34

    defaultConfig {
        minSdk = 21
        targetSdk = 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                useJUnitPlatform()
                testLogging {
                    events "passed", "skipped", "failed"
                    exceptionFormat = 'full'
                    showStandardStreams = true
                }
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/kotlin']
        }
        test {
            java.srcDirs = ['src/test/kotlin']
        }
    }

    lint {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.21"
    implementation 'com.google.code.gson:gson:2.10.1'
    api 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.dmfs:lib-recur:0.12.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'com.android.support:support-compat:28.0.0'
    implementation 'com.android.support:support-v4:28.0.0'
    
    testCompileOnly("io.flutter:flutter_embedding_debug:1.0.0-${readFlutterEngineVersion()}") {
        transitive = false
    }
    
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.1'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.2.1'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
}

afterEvaluate {
    tasks.named('testDebugUnitTest') {
        filter {
            includeTestsMatching "com.builttoroam.devicecalendar.EventRecurrenceTest"
        }
        testLogging {
            events "passed", "skipped", "failed"
            exceptionFormat = 'full'
            showStandardStreams = true
        }
    }
}
