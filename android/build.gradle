plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

String findFlutterSdkPath() {
    def properties = new Properties()
    def localPropertiesFile = file("local.properties")
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withInputStream { properties.load(it) }
    }

    def candidates = [
        properties.getProperty("flutter.sdk"),
        System.getenv("FLUTTER_ROOT"),
        new File(rootDir.parentFile, ".fvm/flutter_sdk").path,
        new File(System.getProperty("user.home"), "fvm/default").path,
    ].findAll { it != null && !it.trim().isEmpty() }

    def flutterSdkPath = candidates.find { new File(it).exists() }
    assert flutterSdkPath != null : "Unable to locate Flutter SDK. Set flutter.sdk in local.properties, FLUTTER_ROOT, or install via FVM."
    return flutterSdkPath
}

String readFlutterEngineVersion() {
    return new File(findFlutterSdkPath(), "bin/cache/engine.stamp").text.trim()
}

android {
    namespace = 'com.builttoroam.devicecalendar'
    compileSdk = 35

    defaultConfig {
        minSdk = 21
        targetSdk = 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
            all {
                useJUnitPlatform()
                testLogging {
                    events "passed", "skipped", "failed"
                    exceptionFormat = 'full'
                    showStandardStreams = true
                }
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/kotlin']
        }
        test {
            java.srcDirs = ['src/test/kotlin']
        }
    }

    lint {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.21"
    implementation 'com.google.code.gson:gson:2.15.0'
    // Core 1.16 is the final stable line supporting this plugin's API 21 minimum.
    implementation 'androidx.core:core:1.16.0'
    implementation 'org.dmfs:lib-recur:0.17.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'androidx.annotation:annotation:1.11.0'
    
    testCompileOnly("io.flutter:flutter_embedding_debug:1.0.0-${readFlutterEngineVersion()}") {
        transitive = false
    }
    
    if (project == rootProject) {
        // Flutter's consuming app supplies embedding classes; standalone tests do not.
        compileOnly("io.flutter:flutter_embedding_debug:1.0.0-${readFlutterEngineVersion()}") {
            transitive = false
        }
    }

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}
