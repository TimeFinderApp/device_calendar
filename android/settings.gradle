pluginManagement {
    def resolveFlutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }

        def candidates = [
            properties.getProperty("flutter.sdk"),
            System.getenv("FLUTTER_ROOT"),
            new File(settingsDir.parentFile, ".fvm/flutter_sdk").path,
            new File(System.getProperty("user.home"), "fvm/default").path,
        ].findAll { it != null && !it.trim().isEmpty() }

        def flutterSdkPath = candidates.find { new File(it).exists() }
        assert flutterSdkPath != null : "Unable to locate Flutter SDK. Set flutter.sdk in local.properties, FLUTTER_ROOT, or install via FVM."
        return flutterSdkPath
    }

    def flutterSdkPath = resolveFlutterSdkPath()
    def storageUrl = System.getenv('FLUTTER_STORAGE_BASE_URL') ?: 'https://storage.googleapis.com'
    def engineRealm = new File(flutterSdkPath, 'bin/cache/engine.realm').text.trim()
    def flutterMavenRepo = engineRealm ? "$storageUrl/${engineRealm}/download.flutter.io" : "$storageUrl/download.flutter.io"

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven {
            url = uri(flutterMavenRepo)
        }
    }
}

