pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }

        def candidates = [
            properties.getProperty("flutter.sdk"),
            System.getenv("FLUTTER_ROOT"),
            new File(settingsDir.parentFile, ".fvm/flutter_sdk").path,
            new File(System.getProperty("user.home"), "fvm/default").path,
        ].findAll { it != null && !it.trim().isEmpty() }

        def flutterSdkPath = candidates.find { new File(it).exists() }
        assert flutterSdkPath != null : "Unable to locate Flutter SDK. Set flutter.sdk in local.properties, FLUTTER_ROOT, or install via FVM."
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.2.1" apply false
    id "org.jetbrains.kotlin.android" version "1.9.0" apply false
}

include ":app"

def flutterProjectRoot = rootProject.projectDir.parentFile.toPath()

def plugins = new Properties()
def pluginsFile = new File(flutterProjectRoot.toFile(), '.flutter-plugins')
if (pluginsFile.exists()) {
    pluginsFile.withReader('UTF-8') { reader -> plugins.load(reader) }
}

plugins.each { name, path ->
    def pluginDirectory = flutterProjectRoot.resolve(path).resolve('android').toFile()
    include ":$name"
    project(":$name").projectDir = pluginDirectory
}
