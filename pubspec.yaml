name: device_calendar
description: A cross platform plugin for modifying calendars on the user's device.
version: 4.4.0
homepage: https://github.com/builttoroam/device_calendar/tree/master/device_calendar

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  json_annotation: ^4.8.1
  timezone: ^0.9.2
  rrule: ^0.2.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  plugin:
    platforms:
      android:
        package: com.builttoroam.devicecalendar
        pluginClass: DeviceCalendarPlugin
      ios:
        pluginClass: DeviceCalendarPlugin
        podspec: ios/device_calendar.podspec
      macos:
        pluginClass: DeviceCalendarPlugin
        podspec: macos/device_calendar.podspec
